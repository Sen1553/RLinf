defaults:
  - env/libero_object_ood@env.eval
  - model/openvla_oft@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_ood_openvlaoft_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

rollout:
  sampling_params:
    do_sample: False
    temperature_train: 1.0
    temperature_eval: -1.0
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora"
    model_type: "openvla_oft"
    unnorm_key: libero_130_no_noops_trajall
    max_prompt_length: 128
    is_lora: False
