# @package _global_

# Sequential GRPO + LoRA on the 10 LIBERO-Goal-OOD tasks.
# Target host: 1 x A800 80GB, 14 CPU cores, and about 120GB system RAM.
# The task range is selected by examples/crl_experiment/run_embodiment_sequential.sh.

defaults:
  - /env/libero_goal_ood@env.train
  - /env/libero_goal_ood@env.eval
  - /model/starvla@actor.model
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /weight_syncer/patch_syncer@weight_syncer
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  weight_sync_interval: 1
  # Actor and rollout stay resident on the A800. Do not overlap environment
  # bootstrap with training on this single-GPU placement.
  overlap_env_bootstrap: False
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "continual_goal_ood_starvla_a800_1gpu_qwenoft25"
    logger_backends: ["tensorboard","wandb"]
  # These are per-task values. The sequential launcher also sets them from its
  # command-line arguments and saves once at the end of every task.
  max_epochs: 120
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  adv_type: grpo
  loss_type: actor
  # Ten stochastic rollouts of the same task/reset form one GRPO comparison
  # group. Ten envs use most of the 14 CPU cores without oversubscribing them.
  group_size: 10
  normalize_advantages: True
  kl_penalty: kl
  kl_beta: 0.001
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  loss_agg_func: "token-mean"
  entropy_bonus: 0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    is_eval: False
    # Four rollout passes amortize reset/model synchronization overhead while
    # keeping the collected batch large enough for global_batch_size=512.
    rollout_epoch: 4
    total_num_envs: 10
    group_size: ${algorithm.group_size}
    task_id_filter: null
    # Keep each GRPO group on one preselected logical task/reset. Sample groups
    # randomly during training instead of traversing the logical pool in order.
    auto_reset: False
    ignore_terminations: False
    # The benchmark horizon is 300 environment steps. StarVLA emits chunks of
    # 8, so RLinf requests 304 and the OOD environment truncates at 300.
    max_episode_steps: 304
    max_steps_per_rollout_epoch: 304
    reward_coef: ${algorithm.reward_coef}
    seed: 42
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    is_eval: True
    # Ten parallel environments cover all ten tasks once per epoch. Thirty
    # epochs therefore evaluate 30 BDDL-sampled episodes per task.
    rollout_epoch: 30
    total_num_envs: 10
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 304
    max_steps_per_rollout_epoch: 304
    seed: 7
    # Evaluation consumes the balanced logical task/trial pool without
    # replacement; physical layouts still come from self.env.reset().
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: ${actor.model.unnorm_key}
  # The 3B StarVLA checkpoint is about 8.2GB. Keeping actor and rollout on an
  # 80GB A800 avoids CPU<->GPU transfers and is faster than offload mode.
  enable_offload: False
  pipeline_stage_num: 1
  sampling_params:
    do_sample: True
    temperature_train: 0.3
    temperature_eval: -1.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
    max_new_tokens: 256
  model:
    model_path: ${oc.env:STARVLA_MODEL_PATH,/path/to/Qwen2.5-VL-OFT-LIBERO-4in1}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Four samples per forward/backward should fit the 80GB A800 with this 3B
  # model and LoRA while providing much better utilization than micro-batch 1.
  micro_batch_size: 4
  global_batch_size: 512
  seed: 42
  enable_offload: False
  model:
    model_path: ${oc.env:STARVLA_MODEL_PATH,/path/to/Qwen2.5-VL-OFT-LIBERO-4in1}
    precision: "bf16"
    action_dim: 7
    num_action_chunks: 8
    unnorm_key: franka
    add_value_head: False
    action_stats_source: "minmax"
    is_lora: True
    lora_rank: 32
    lora_path: null
    starvla:
      framework_name: "QwenOFT"
      expected_action_dim: ${actor.model.action_dim}
      expected_num_action_chunks: ${actor.model.num_action_chunks}
      enable_state_input: False
  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 2.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    # LoRA greatly reduces trainable state. Leave checkpointing disabled for
    # speed; enable it only if an actual run exceeds the 80GB budget.
    gradient_checkpointing: False
    cpu_offload: False
    forward_prefetch: False
    limit_all_gathers: False
    backward_prefetch: null
    use_orig_params: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
